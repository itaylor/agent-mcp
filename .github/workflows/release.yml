name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: agent-mcp

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 GNU
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          # Linux x86_64 musl (fully static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false

          # Linux aarch64 GNU
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          # Linux aarch64 musl (fully static)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --- Linux GNU deps (native) ---
      - name: Install aarch64 GNU cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # --- Linux musl deps (native x86_64) ---
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --- cross for aarch64 Linux builds ---
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # --- Build ---
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      # --- Package ---
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGING="$BINARY_NAME-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGING"
          cp "target/${{ matrix.target }}/release/$BINARY_NAME" "$STAGING/"
          cp README.md "$STAGING/"
          tar czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "$env:BINARY_NAME-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $staging
          Copy-Item "target\${{ matrix.target }}\release\$env:BINARY_NAME.exe" "$staging\"
          Copy-Item README.md "$staging\"
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # --- Upload artifact so the release job can collect everything ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
