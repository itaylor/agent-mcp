[package]
name = "agent-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.15", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["full"] }
schemars = "1"
ropey = "1.6"
tree-sitter = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-java = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
rand = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
